                        adminTab === tab.id

                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                <div className="p-6 overflow-y-auto custom-scroll flex-1 space-y-6">
                  
                  {/* TAB 1: KELOLA PRODUK */}

                                    reader.onload = (ev) => setNewProdImage(ev.target.result);
                                    reader.readAsDataURL(file);
                                  }
                                }}
                                className="w-full text-xs text-[#173D2B]"

                              <label className="font-bold text-[#173D2B] block mb-1">

                                className="w-full p-2.5 rounded-xl border border-[#E9D8BD]/40 bg-white"

                                <div className="truncate text-xs">

                                    {p.category}

                                  <h5 className="font-bold text-[#173D2B] truncate">{p.name}</h5>
                                  <a

                                    rel="noopener noreferrer"
                                    className="text-[10px] text-blue-600 hover:underline block truncate"

                              <button

                          <div key={d.id} className="p-3 bg-[#F8F4EC] rounded-xl flex items-center justify-between">

                  {/* TAB 4: GUIDES */}
                  {adminTab === 'guides' && (
                    <div className="space-y-4 text-xs">
                      <div className="p-4 bg-[#F8F4EC] rounded-2xl space-y-3">
                        <label className="font-bold block">No. WhatsApp Rizal:</label>
                        <input
                          type="text"
                          value={editGuideRizalWA}
                          onChange={(e) => setEditGuideRizalWA(e.target.value)}
                          className="w-full p-2 bg-white rounded-lg border border-[#E9D8BD]"
                        />
                        <label className="font-bold block">No. WhatsApp Rifa:</label>
                        <input
                          type="text"
                          value={editGuideRifaWA}
                          onChange={(e) => setEditGuideRifaWA(e.target.value)}
                          className="w-full p-2 bg-white rounded-lg border border-[#E9D8BD]"
                        />
                        <button
                          onClick={() => alert('Kontak WhatsApp berhasil disimpan!')}
                          className="px-4 py-2 bg-[#173D2B] text-white rounded-lg font-bold"
                        >

                        </button>
                      </div>
                    </div>
                  )}

                  {/* TAB 5: BACKUP & RESET */}
                  {adminTab === 'backup' && (
                    <div className="space-y-4 text-xs">

                        <h4 className="font-bold text-[#173D2B]">Unduh Cadangan Data</h4>
                        <button
                          onClick={() => {
                            const data = { products, destinations, videos, guides };
                            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'sukaregang_data.json';
                            a.click();
                          }}
                          className="px-4 py-2 bg-[#173D2B] text-white rounded-lg font-bold"
                        >
                          📥 Unduh Backup JSON
                        </button>
                      </div>

                  )}

                </div>
              </div>
            </div>
          )}

        </div>

    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

      return <i data-lucide={name} className={className}></i>;
    }

                                className="w-full p-2.5 rounded-xl border border-[#D6B889]/40 bg-white"
                              >
                                <option>Sejarah Garut</option>
                                <option>Teknik Pembuatan Sepatu</option>
                                <option>Proses Bahan Dasar</option>
                                <option>Wisata Belanja</option>
                              </select>
                            </div>

                            <div>
                              <label className="font-bold text-[#253B32] block mb-1">
                                Link YouTube atau Video ID:
                              </label>
                              <input
                                type="text"
                                required
                                value={newVidUrl}
                                onChange={(e) => setNewVidUrl(e.target.value)}
                                placeholder="Contoh: https://youtu.be/EEXRwNz6eiM..."
                                className="w-full p-2.5 rounded-xl border border-[#D6B889]/40 bg-white"
                              />
                            </div>
                          </div>

                          <div>
                            <label className="font-bold text-[#253B32] block mb-1">Deskripsi Video:</label>
                            <input
                              type="text"
                              value={newVidDesc}
                              onChange={(e) => setNewVidDesc(e.target.value)}
                              placeholder="Penjelasan isi video edukasi..."
                              className="w-full p-2.5 rounded-xl border border-[#D6B889]/40 bg-white"
                            />
                          </div>

                          <button
                            type="submit"
                            className="py-2.5 px-5 bg-[#253B32] hover:bg-[#1C2C25] text-white font-bold rounded-xl shadow transition"
                          >
                            ➕ Simpan Video
                          </button>
                        </form>
                      </div>

                      {/* List Video */}
                      <div className="space-y-3">
                        <h4 className="font-serif font-bold text-base text-[#253B32]">
                          Video Edukasi yang Aktif ({videos.length}):
                        </h4>
                        <div className="space-y-2">
                          {videos.map((v) => (
                            <div
                              key={v.id}
                              className="p-3 bg-white rounded-xl border border-[#D6B889]/40 flex items-center justify-between text-xs"
                            >
                              <div>
                                <span className="text-[10px] text-[#A66D43] font-bold uppercase">{v.category}</span>
                                <h5 className="font-bold text-[#253B32]">{v.title}</h5>
                                <span className="text-[10px] text-gray-500">ID: {v.youtubeId}</span>
                              </div>
                              <button
                                onClick={() => {
                                  const updated = videos.filter((vid) => vid.id !== v.id);
                                  setVideos(updated);
                                  try {
                                    localStorage.setItem('sukaregang_videos_list_v2', JSON.stringify(updated));
                                  } catch (err) {}
                                }}
                                className="px-2.5 py-1 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg font-bold"
                              >
                                Hapus
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 4: KELOLA TOUR GUIDE WA */}
                  {adminTab === 'guides' && (
                    <div className="space-y-6">
                      <div className="bg-[#F5F0E7] rounded-2xl p-5 border border-[#D6B889]/40 space-y-4">
                        <h4 className="font-serif font-bold text-base text-[#253B32]">
                          Ubah Kontak WhatsApp Tour Guide
                        </h4>

                        <form onSubmit={handleAdminSaveGuides} className="space-y-4 text-xs">
                          <div>
                            <label className="font-bold text-[#253B32] block mb-1">
                              Nomor WhatsApp Rizal:
                            </label>
                            <input
                              type="text"
                              value={editGuideRizalWA}
                              onChange={(e) => setEditGuideRizalWA(e.target.value)}
                              placeholder="+62 851-5059-1968"
                              className="w-full p-2.5 rounded-xl border border-[#D6B889]/40 bg-white"
                            />
                          </div>

                          <div>
                            <label className="font-bold text-[#253B32] block mb-1">
                              Nomor WhatsApp Rifa:
                            </label>
                            <input
                              type="text"
                              value={editGuideRifaWA}
                              onChange={(e) => setEditGuideRifaWA(e.target.value)}
                              placeholder="+62 812-2056-9575"
                              className="w-full p-2.5 rounded-xl border border-[#D6B889]/40 bg-white"
                            />
                          </div>

                          <button
                            type="submit"
                            className="py-2.5 px-5 bg-[#253B32] hover:bg-[#1C2C25] text-white font-bold rounded-xl shadow transition"
                          >
                            💾 Simpan Perubahan Nomor WhatsApp Guide
                          </button>
                        </form>
                      </div>
                    </div>
                  )}

                  {/* TAB 5: BACKUP & RESET */}
                  {adminTab === 'backup' && (
                    <div className="space-y-5 text-xs">
                      <div className="bg-white p-5 rounded-2xl border border-[#D6B889]/40 space-y-3">
                        <h4 className="font-serif font-bold text-base text-[#253B32]">
                          Ekspor & Backup Data Aplikasi
                        </h4>
                        <p className="text-[#292B29]/75">
                          Unduh seluruh data produk, destinasi, dan kontak dalam format file JSON untuk cadangan.
                        </p>
                        <button
                          onClick={() => {
                            const exportData = {
                              products,
                              destinations,
                              videos,
                              guides,
                              exportedAt: new Date().toISOString()
                            };
                            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'sukaregang_discovery_data.json';
                            a.click();
                          }}
                          className="px-4 py-2.5 bg-[#253B32] text-white font-bold rounded-xl shadow hover:bg-[#1C2C25] transition"
                        >
                          📥 Unduh Backup JSON
                        </button>
                      </div>

                      <div className="bg-red-50 p-5 rounded-2xl border border-red-200 space-y-3">
                        <h4 className="font-serif font-bold text-base text-red-700">
                          Reset Pengaturan Aplikasi
                        </h4>
                        <p className="text-red-700/80">
                          Mengembalikan seluruh produk, destinasi, dan data kembali ke bawaan awal pabrik.
                        </p>
                        <button
                          onClick={() => {
                            if (!confirm('Peringatan: Seluruh data tambahan kustom akan dihapus dan kembali ke pengaturan awal. Lanjutkan?')) return;
                            localStorage.clear();
                            setProducts(DEFAULT_PRODUCTS);
                            setDestinations(DEFAULT_TOUR_DESTINATIONS);
                            setVideos(DEFAULT_VIDEOS);
                            setGuides(DEFAULT_TOUR_GUIDES);
                            setCustomImages({});
                            setCurrentUser(null);
                            alert('Aplikasi telah di-reset ke kondisi awal!');
                          }}
                          className="px-4 py-2.5 bg-red-600 text-white font-bold rounded-xl shadow hover:bg-red-700 transition"
                        >
                          ⚠️ Reset Semua Data ke Default Pabrik
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

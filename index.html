    // --- VIRTUAL TOUR 360 COMPONENT ---
    function VirtualTour360() {
      const [currentSpot, setCurrentSpot] = useState(0);
      const [yaw, setYaw] = useState(0);
      const [pitch, setPitch] = useState(0);
      const [zoom, setZoom] = useState(1);
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [showInstructions, setShowInstructions] = useState(true);

      const spots = [
        {
          id: 'spot-gerbang',
          title: 'Gerbang Sentra Sukaregang',
          locationName: 'Pintu Gerbang Utama & Tugu Sukaregang',
          desc: 'Titik masuk ikonik ke kawasan sentra industri dan sentra pertokoan kulit Garut.',
          bgUrl: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1600&q=85',
        },
        {
          id: 'spot-koridor',
          title: 'Koridor Galeri Kulit',
          locationName: 'Jl. Gagak Lumayung Sukaregang',
          desc: 'Jajaran etalase perajin kulit dengan display jaket dan sepatu khas Sukaregang.',
          bgUrl: 'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=1600&q=85',
        },
        {
          id: 'spot-workshop',
          title: 'Bengkel Penyamakan Tradisional',
          locationName: 'Workshop Pengolahan & Pengeringan Kulit',
          desc: 'Area penyamakan dan pengolahan lembaran kulit domba dan sapi mentah.',
          bgUrl: 'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=1600&q=85',
        },
        {
          id: 'spot-syakira',
          title: 'Showroom Syakira Leather',
          locationName: 'Pusat Koleksi Jaket & Sepatu Kulit',
          desc: 'Toko kurasi produk kulit asli Sukaregang dengan standar mutu terjamin.',
          bgUrl: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=1600&q=85',
        },
      ];

      const activeSpot = spots[currentSpot];

      const handleMouseDown = (e) => {
        setIsDragging(true);
        setDragStart({ x: e.clientX, y: e.clientY });
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        setYaw((prev) => (prev + dx * 0.25) % 360);
        setPitch((prev) => Math.max(-40, Math.min(40, prev - dy * 0.15)));
        setDragStart({ x: e.clientX, y: e.clientY });
      };

      const handleMouseUp = () => setIsDragging(false);

      const handleTouchStart = (e) => {
        if (e.touches.length === 1) {
          setIsDragging(true);
          setDragStart({ x: e.touches[0].clientX, y: e.touches[0].clientY });
        }
      };

      const handleTouchMove = (e) => {
        if (!isDragging || e.touches.length !== 1) return;
        const dx = e.touches[0].clientX - dragStart.x;
        const dy = e.touches[0].clientY - dragStart.y;
        setYaw((prev) => (prev + dx * 0.3) % 360);
        setPitch((prev) => Math.max(-40, Math.min(40, prev - dy * 0.2)));
        setDragStart({ x: e.touches[0].clientX, y: e.touches[0].clientY });
      };

      const handleTouchEnd = () => setIsDragging(false);

      return (
        <div className="relative w-full rounded-2xl overflow-hidden bg-forest-900 border-2 border-warmbeige/40 shadow-2xl">
          {/* 360 Viewer Canvas Container */}
          <div
            className="relative h-[480px] md:h-[580px] w-full overflow-hidden cursor-grab active:cursor-grabbing select-none"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
          >
            {/* Simulated 360 Panoramic Background Projection */}
            <div
              className="absolute inset-0 bg-cover bg-center transition-transform duration-75 will-change-transform"
              style={{
                backgroundImage: `url(${activeSpot.bgUrl})`,
                transform: `scale(${zoom}) translate(${yaw * 1.5}px, ${pitch * 1.2}px)`,
                filter: 'brightness(0.92) contrast(1.05)',
              }}
            />

            {/* Subtle Vignette & Grid Overlay */}
            <div className="absolute inset-0 bg-gradient-to-t from-forest-900/90 via-transparent to-forest-900/50 pointer-events-none" />

            {/* 360 Compass Heading Indicator */}
            <div className="absolute top-4 left-4 z-10 flex items-center space-x-2 bg-forest/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-warmbeige/40 text-cream text-xs">
              <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
              <span className="font-semibold tracking-wider">360° LIVE PANORAMA</span>
              <span className="text-warmbeige">| Arah: {Math.round((yaw + 360) % 360)}°</span>
            </div>

            {/* Zoom Controls */}
            <div className="absolute top-4 right-4 z-10 flex flex-col space-y-2 bg-forest/80 backdrop-blur-md p-1.5 rounded-xl border border-warmbeige/40 text-cream">
              <button
                onClick={() => setZoom((z) => Math.min(2.0, z + 0.2))}
                className="w-8 h-8 flex items-center justify-center hover:bg-leather rounded-lg transition"
                title="Perbesar (Zoom In)"
              >
                <Icon name="zoom-in" className="w-4 h-4" />
              </button>
              <button
                onClick={() => setZoom((z) => Math.max(0.9, z - 0.2))}
                className="w-8 h-8 flex items-center justify-center hover:bg-leather rounded-lg transition"
                title="Perkecil (Zoom Out)"
              >
                <Icon name="zoom-out" className="w-4 h-4" />
              </button>
              <button
                onClick={() => { setYaw(0); setPitch(0); setZoom(1); }}
                className="w-8 h-8 flex items-center justify-center hover:bg-leather rounded-lg transition"
                title="Atur Ulang Tampilan"
              >
                <Icon name="rotate-ccw" className="w-4 h-4" />
              </button>
            </div>

            {/* Instruction Modal Tooltip */}
            {showInstructions && (
              <div className="absolute inset-x-4 bottom-24 md:bottom-20 max-w-md mx-auto z-10 bg-forest/90 backdrop-blur-md text-cream p-4 rounded-xl border border-warmbeige/40 shadow-xl text-center">
                <div className="flex justify-between items-center mb-1">
                  <div className="flex items-center space-x-2 text-warmbeige font-semibold text-xs tracking-wider uppercase">
                    <Icon name="compass" className="w-4 h-4" />
                    <span>Petunjuk Virtual Tour 360°</span>
                  </div>
                  <button onClick={() => setShowInstructions(false)} className="text-cream/60 hover:text-cream text-xs">
                    ✕
                  </button>
                </div>
                <p className="text-xs text-cream/90 leading-relaxed">
                  <strong>Klik & Geser (drag)</strong> untuk memutar sudut pandang kawasan. Gunakan tombol zoom di kanan atas untuk melihat detail tekstur dan suasana.
                </p>
              </div>
            )}

            {/* Active Vantage Point Info Banner */}
            <div className="absolute bottom-4 left-4 right-4 z-10 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-3 pointer-events-none">
              <div className="bg-forest/85 backdrop-blur-md p-3.5 rounded-xl border border-warmbeige/40 text-cream max-w-md pointer-events-auto">
                <div className="text-[10px] uppercase font-bold tracking-widest text-warmbeige">Titik Eksplorasi {currentSpot + 1} / {spots.length}</div>
                <h4 className="font-serif text-lg font-bold text-cream">{activeSpot.title}</h4>
                <p className="text-xs text-cream/80 mt-0.5">{activeSpot.desc}</p>
                <div className="mt-2 flex items-center space-x-1.5 text-[11px] text-warmbeige/90">
                  <Icon name="map-pin" className="w-3.5 h-3.5 text-leather-light" />
                  <span>{activeSpot.locationName}</span>
                </div>
              </div>
            </div>
          </div>

          {/* Spot Switcher Bar */}
          <div className="bg-forest p-3.5 border-t border-warmbeige/30 flex flex-wrap items-center justify-between gap-2">
            <span className="text-xs text-warmbeige font-medium">Pilih Sudut Pandang Kawasan:</span>
            <div className="flex flex-wrap gap-2">
              {spots.map((spot, idx) => (
                <button
                  key={spot.id}
                  onClick={() => {
                    setCurrentSpot(idx);
                    setYaw(0);
                    setPitch(0);
                  }}
                  className={`text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center space-x-1.5 ${
                    currentSpot === idx
                      ? 'bg-warmbeige text-forest font-bold shadow'
                      : 'bg-forest-900/60 text-cream/80 hover:bg-forest-700 hover:text-cream border border-warmbeige/20'
                  }`}
                >
                  <Icon name="camera" className="w-3.5 h-3.5" />
                  <span>{spot.title}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Important Technical / Photography Disclaimer */}
          <div className="bg-forest-900 px-4 py-2 border-t border-warmbeige/10 flex items-center justify-between text-[11px] text-cream/70">
            <span className="flex items-center space-x-1.5">
              <Icon name="info" className="w-3.5 h-3.5 text-warmbeige" />
              <span>Komponen siap menerima file panorama 360° resolusi tinggi dokumentasi resmi Sukaregang.</span>
            </span>
            <span className="hidden sm:inline text-warmbeige/80">Garut Heritage Experience</span>
          </div>
        </div>
      );
    }

    // --- INTERACTIVE MAP COMPONENT ---
    function SukaregangMap({ locations, onSelectLocation }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const [selectedLoc, setSelectedLoc] = useState(locations[0]);
      const [activeCategory, setActiveCategory] = useState('Semua');

      const categories = ['Semua', 'Sentra Industri', 'Landmark', 'Edukasi', 'Toko Mitra'];

      const filteredLocations = useMemo(() => {
        if (activeCategory === 'Semua') return locations;
        return locations.filter((l) => l.category === activeCategory);
      }, [locations, activeCategory]);

      useEffect(() => {
        if (!mapContainerRef.current) return;

        // Initialize Leaflet Map centered at Sukaregang, Garut
        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current).setView([-7.2148, 107.9155], 16);
          
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors | Sukaregang Discovery',
          }).addTo(map);

          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;

        // Clear existing markers
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) {
            map.removeLayer(layer);
          }
        });

        // Add markers for filtered locations
        filteredLocations.forEach((loc) => {
          const marker = L.marker(loc.coordinates).addTo(map);
          marker.bindPopup(`
            <div style="padding: 4px; min-width: 180px;">
              <span style="font-size: 10px; text-transform: uppercase; color: #D6B889; font-weight: bold;">${loc.category}</span>
              <h4 style="margin: 2px 0 6px 0; font-size: 14px; font-weight: bold; color: #F5F0E7;">${loc.name}</h4>
              <p style="margin: 0; font-size: 11px; color: #C2D7CD;">${loc.address}</p>
            </div>
          `);

          marker.on('click', () => {
            setSelectedLoc(loc);
            if (onSelectLocation) onSelectLocation(loc);
          });
        });
      }, [filteredLocations]);

      const handleCardClick = (loc) => {
        setSelectedLoc(loc);
        if (mapInstanceRef.current) {
          mapInstanceRef.current.flyTo(loc.coordinates, 17, { duration: 1.2 });
        }
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
          {/* Map Viewer */}
          <div className="lg:col-span-2 rounded-2xl overflow-hidden border-2 border-warmbeige/40 shadow-xl bg-forest-900 relative">
            {/* Category Filter Pills */}
            <div className="absolute top-4 left-4 z-[500] flex flex-wrap gap-1.5 bg-forest/85 backdrop-blur-md p-1.5 rounded-xl border border-warmbeige/40 shadow-lg">
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setActiveCategory(cat)}
                  className={`text-xs px-2.5 py-1 rounded-lg transition font-medium ${
                    activeCategory === cat
                      ? 'bg-warmbeige text-forest font-bold'
                      : 'text-cream/80 hover:text-cream hover:bg-forest-700'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            {/* Leaflet DOM container */}
            <div ref={mapContainerRef} className="h-[460px] md:h-[540px] w-full" />
            
            {/* Map Legend */}
            <div className="p-3 bg-forest text-cream text-xs border-t border-warmbeige/20 flex flex-wrap items-center justify-between gap-2">
              <span className="flex items-center space-x-2 text-warmbeige">
                <Icon name="compass" className="w-4 h-4 text-warmbeige" />
                <span>Peta Interaktif Kawasan Sentra Sukaregang, Garut Kota</span>
              </span>
              <span className="text-cream/70 text-[11px]">Koordinat Terverifikasi Sukaregang, Garut</span>
            </div>
          </div>

          {/* Location Details Inspector Drawer */}
          <div className="bg-white rounded-2xl p-6 border-2 border-warmbeige/30 shadow-lg">
            <div className="flex items-center justify-between pb-3 border-b border-warmbeige/20 mb-4">
              <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-forest/10 text-forest">
                {selectedLoc.category}
              </span>
              <span className="text-[11px] text-charcoal/60">Titik Terpilih</span>
            </div>

            <img

                <h6 className="text-xs font-bold uppercase tracking-wider text-forest mb-2 flex items-center space-x-1.5">
                  <Icon name="wrench" className="w-4 h-4 text-leather" />
                  <span>Peralatan & Instrumen Utama:</span>

                <div className="flex flex-wrap gap-1.5">

                      className="px-2.5 py-1 bg-white rounded-lg text-xs font-medium text-charcoal/80 border border-warmbeige/30"

                  <Icon name="arrow-right" className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          </div>
        </div>

                    ✕
                  </button>
                </div>

                <div className="p-6 space-y-4">
                  <div className="flex items-center space-x-3.5 pb-4 border-b border-[#ECE3D4]">
                    <img
                      src={currentUser.avatarUrl || './logo.png'}
                      alt={currentUser.name}
                      className="w-16 h-16 rounded-2xl object-contain border-2 border-[#E9D8BD] bg-[#173D2B] p-1"
                    />
                    <div>
                      <h4 className="font-serif text-lg font-bold text-[#173D2B]">{currentUser.name}</h4>
                      <p className="text-xs text-[#35251D]/70">{currentUser.email}</p>
                      <p className="text-xs text-emerald-700 font-bold mt-0.5">📱 WA: {currentUser.phone}</p>
                    </div>
                  </div>

                  <button
                    onClick={() => {
                      setIsProfileModalOpen(false);
                      setIsAdminPortalOpen(true);
                    }}
                    className="w-full py-2.5 px-4 bg-[#8B4A2B] hover:bg-[#6E381F] text-white text-xs font-bold rounded-xl transition shadow flex items-center justify-center space-x-2"
                  >
                    <Icon name="sliders" className="w-4 h-4" />
                    <span>Buka Portal Admin Lengkap</span>
                  </button>

                  <button
                    onClick={handleLogout}
                    className="w-full py-2.5 px-4 bg-white hover:bg-red-50 text-red-600 text-xs font-bold rounded-xl border border-red-200 transition"
                  >
                    Keluar dari Akun (Log Out)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              MODAL DETAIL PRODUK
          ================================================================= */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#35251D]/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white rounded-3xl max-w-2xl w-full overflow-hidden shadow-2xl border-2 border-[#E9D8BD]/40 relative max-h-[92vh] flex flex-col">
                <div className="p-4 sm:p-5 bg-[#173D2B] text-[#F8F4EC] flex items-center justify-between border-b border-[#E9D8BD]/30">
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-bold uppercase text-[#E9D8BD]">{selectedProduct.category}</span>
                    <span>•</span>
                    <span className="text-xs font-semibold text-[#F8F4EC]">{selectedProduct.storeName}</span>
                  </div>
                  <button
                    onClick={() => setSelectedProduct(null)}
                    className="w-8 h-8 rounded-full bg-[#102B1E] hover:bg-[#8B4A2B] flex items-center justify-center text-white"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-6 overflow-y-auto custom-scroll flex-1 space-y-4">
                  <div className="h-72 rounded-2xl overflow-hidden bg-[#F8F4EC] border border-[#E9D8BD]/40">
                    <img
                      src={customImages[selectedProduct.id] || selectedProduct.imageUrl}
                      alt={selectedProduct.name}
                      referrerPolicy="no-referrer"
                      className="w-full h-full object-cover"
                      onError={(e) => {
                        e.target.onerror = null;
                        e.target.src = selectedProduct.fallbackUrl || "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=600&q=80";
                      }}
                    />
                  </div>
                  <h3 className="font-serif text-2xl font-bold text-[#173D2B]">{selectedProduct.name}</h3>
                  <p className="text-xs text-[#35251D]/80 leading-relaxed bg-[#F8F4EC] p-3 rounded-xl border border-[#E9D8BD]/30">
                    {selectedProduct.description}
                  </p>
                  <div className="bg-[#F2F6F4] p-3 rounded-xl border border-[#173D2B]/20 text-xs font-semibold text-[#173D2B]">
                    🛡️ {selectedProduct.materialInfo}
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                    <a
                      href={selectedProduct.shopeeUrl}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="py-3.5 bg-[#8B4A2B] hover:bg-[#6E381F] text-white font-bold text-xs rounded-xl text-center shadow-lg transition flex items-center justify-center space-x-2"
                    >
                      <span>Beli Produk Ini di Shopee ↗</span>
                    </a>
                    <a
                      href={SYAKIRA_OFFICIAL_SHOPEE_STORE}
                      target="_blank"
                      rel="noopener noreferrer"
                      className="py-3.5 bg-[#173D2B] hover:bg-[#102B1E] text-white font-bold text-xs rounded-xl text-center shadow-lg transition flex items-center justify-center space-x-2"
                    >
                      <span>Kunjungi Official Store Syakira ↗</span>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* =================================================================
              PORTAL ADMIN LENGKAP & TELAH DIPERBAIKI (KELOLA SEMUA FITUR)
          ================================================================= */}
          {isAdminPortalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 bg-[#35251D]/90 backdrop-blur-md animate-fadeIn">
              <div className="bg-white rounded-3xl max-w-5xl w-full overflow-hidden shadow-2xl border-2 border-[#E9D8BD]/40 relative max-h-[94vh] flex flex-col">
                
                {/* Header Portal Admin */}
                <div className="p-5 bg-[#173D2B] text-[#F8F4EC] flex items-center justify-between border-b border-[#E9D8BD]/30">
                  <div className="flex items-center space-x-3">
                    <img src="./logo.png" alt="Logo" className="w-10 h-10 object-contain drop-shadow" />
                    <div>
                      <h3 className="font-serif text-lg font-bold flex items-center space-x-2">
                        <span>PORTAL ADMIN KONTEN & TOKO</span>
                        <span className="px-2 py-0.5 rounded-full bg-[#8B4A2B] text-white text-[9px] font-bold">
                          SYAKIRA LEATHER
                        </span>
                      </h3>
                      <p className="text-[11px] text-[#E9D8BD]">
                        Kelola Produk, Kesan Pesan Wisatawan, Titik Peta, Video YouTube & Kontak Tour Guide
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsAdminPortalOpen(false)}
                    className="w-8 h-8 rounded-full bg-[#102B1E] hover:bg-[#8B4A2B] flex items-center justify-center text-white"
                  >
                    ✕
                  </button>
                </div>

                {/* Tab Navigation Admin Rapi & Lengkap */}
                <div className="flex overflow-x-auto bg-[#102B1E] text-[#F8F4EC] p-2 border-b border-[#E9D8BD]/30 text-xs font-semibold custom-scroll">
                  {[
                    { id: 'products', label: '🛍️ Kelola Produk Syakira' },
                    { id: 'reviews', label: `💬 Kesan & Pesan (${reviews.length})` },
                    { id: 'destinations', label: '📍 Titik Peta & Pabrik' },
                    { id: 'videos', label: '🎥 Video YouTube' },
                    { id: 'guides', label: '🧭 Kontak Tour Guide' },
                    { id: 'backup', label: '💾 Cadangan & Reset' },
                  ].map((tab) => (
                    <button
                      key={tab.id}
                      onClick={() => setAdminTab(tab.id)}
                      className={`px-4 py-2 rounded-xl transition flex-shrink-0 ${
                        adminTab === tab.id
                          ? 'bg-[#E9D8BD] text-[#173D2B] font-bold shadow'
                          : 'text-[#F8F4EC]/80 hover:bg-[#173D2B]'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* Content Body Admin */}
                <div className="p-6 overflow-y-auto custom-scroll flex-1 space-y-6">
                  
                  {/* TAB 1: KELOLA PRODUK */}
                  {adminTab === 'products' && (
                    <div className="space-y-6">
                      <div className="bg-[#F8F4EC] rounded-2xl p-5 border border-[#E9D8BD]/40 space-y-4">
                        <h4 className="font-serif font-bold text-base text-[#173D2B] flex items-center space-x-2">
                          <span>➕</span>
                          <span>Tambah Produk Baru ke Syakira Leather</span>
                        </h4>

                        <form onSubmit={handleAdminAddProduct} className="space-y-3.5 text-xs">
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                              <label className="font-bold text-[#173D2B] block mb-1">Nama Produk:</label>
                              <input
                                type="text"
                                required
                                value={newProdName}
                                onChange={(e) => setNewProdName(e.target.value)}
                                placeholder="Contoh: Jaket Kulit Biker Rockstar Domba"
                                className="w-full p-2.5 rounded-xl border border-[#E9D8BD] bg-white"
                              />
                            </div>

                            <div>
                              <label className="font-bold text-[#173D2B] block mb-1">Kategori:</label>
                              <select
                                value={newProdCategory}
                                onChange={(e) => setNewProdCategory(e.target.value)}
                                className="w-full p-2.5 rounded-xl border border-[#E9D8BD] bg-white"
                              >
                                <option>Jaket Kulit Pria</option>
                                <option>Sepatu Pria</option>
                                <option>Sepatu Wanita</option>
                                <option>Aksesoris Kulit</option>
                              </select>
                            </div>
                          </div>

                          <div>
                            <label className="font-bold text-[#173D2B] block mb-1">
                              Tautan Link Produk Shopee:
                            </label>
                            <input
                              type="url"
                              value={newProdShopee}
                              onChange={(e) => setNewProdShopee(e.target.value)}
                              placeholder={`Kosongkan untuk otomatis ke ${SYAKIRA_OFFICIAL_SHOPEE_STORE}`}
                              className="w-full p-2.5 rounded-xl border border-[#E9D8BD] bg-white"
                            />
                          </div>

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                              <label className="font-bold text-[#173D2B] block mb-1">
                                Foto Produk (Upload File dari HP/Laptop):
                              </label>
                              <input
                                type="file"
                                accept="image/*"
                                onChange={(e) => {
                                  const file = e.target.files?.[0];
                                  if (file) {
                                    const reader = new FileReader();
                                    reader.onload = (ev) => setNewProdImage(ev.target.result);
                                    reader.readAsDataURL(file);
                                  }
                                }}
                                className="w-full text-xs text-[#173D2B]"
                              />
                            </div>

                            <div>
                              <label className="font-bold text-[#173D2B] block mb-1">
                                Atau Tautan URL Foto Produk:
                              </label>
                              <input
                                type="url"
                                value={newProdImage.startsWith('data:') ? '' : newProdImage}
                                onChange={(e) => setNewProdImage(e.target.value)}
                                placeholder="https://..."
                                className="w-full p-2.5 rounded-xl border border-[#E9D8BD] bg-white"
                              />
                            </div>
                          </div>

                          {newProdImage && (
                            <div className="flex items-center space-x-3 p-2 bg-white rounded-xl border border-[#E9D8BD]">
                              <img src={newProdImage} alt="Pratinjau" className="w-12 h-12 object-cover rounded-lg" />
                              <span className="text-[11px] text-emerald-700 font-bold">✓ Foto siap disimpan</span>
                            </div>
                          )}

                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                              <label className="font-bold text-[#173D2B] block mb-1">Spesifikasi Bahan:</label>
                              <input
                                type="text"
                                value={newProdMaterial}
                                onChange={(e) => setNewProdMaterial(e.target.value)}
                                placeholder="Contoh: 100% Kulit Domba Asli Garut Super Lembut"
                                className="w-full p-2.5 rounded-xl border border-[#E9D8BD] bg-white"
                              />
                            </div>

                            <div>
                              <label className="font-bold text-[#173D2B] block mb-1">Deskripsi Singkat:</label>
                              <input
                                type="text"
                                value={newProdDesc}
                                onChange={(e) => setNewProdDesc(e.target.value)}
                                placeholder="Contoh: Jaket kulit model formal elegan khas Sukaregang"
                                className="w-full p-2.5 rounded-xl border border-[#E9D8BD] bg-white"
                              />
                            </div>
                          </div>

                          <button
                            type="submit"
                            className="py-2.5 px-5 bg-[#173D2B] hover:bg-[#102B1E] text-white font-bold rounded-xl shadow transition"
                          >
                            ➕ Simpan & Tambahkan ke Katalog Syakira
                          </button>
                        </form>
                      </div>

                      {/* List Produk Aktif */}
                      <div className="space-y-3">
                        <div className="flex items-center justify-between">
                          <h4 className="font-serif font-bold text-base text-[#173D2B]">
                            Daftar Produk yang Sedang Tayang ({products.length}):
                          </h4>
                          <button
                            onClick={() => {
                              if (!confirm('Kembalikan ke 20 produk asli awal?')) return;
                              setProducts(DEFAULT_PRODUCTS);
                              setCustomImages({});
                              localStorage.removeItem('syakira_products_list_v2');
                              alert('Katalog di-reset ke default.');
                            }}
                            className="text-xs text-red-600 hover:underline font-bold"
                          >
                            🔄 Reset ke 20 Produk Default
                          </button>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          {products.map((p) => (
                            <div
                              key={p.id}
                              className="p-3 bg-white rounded-xl border border-[#E9D8BD] shadow-sm flex items-center justify-between gap-3"
                            >
                              <div className="flex items-center space-x-3 overflow-hidden">
                                <img
                                  src={customImages[p.id] || p.imageUrl}
                                  alt={p.name}
                                  referrerPolicy="no-referrer"
                                  className="w-12 h-12 rounded-lg object-cover flex-shrink-0"
                                  onError={(e) => {
                                    e.target.onerror = null;
                                    e.target.src = p.fallbackUrl || "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=200&q=80";
                                  }}
                                />
                                <div className="truncate text-xs">
                                  <span className="text-[10px] font-bold text-[#8B4A2B] block uppercase">{p.category}</span>
                                  <h5 className="font-bold text-[#173D2B] truncate">{p.name}</h5>
                                  <a href={p.shopeeUrl} target="_blank" className="text-[10px] text-blue-600 hover:underline block truncate">
                                    Link Shopee ↗
                                  </a>
                                </div>
                              </div>

                              <button
                                onClick={() => handleAdminDeleteProduct(p.id)}
                                className="px-2.5 py-1 text-xs text-red-600 bg-red-50 hover:bg-red-100 rounded-lg font-bold flex-shrink-0"
                              >
                                Hapus
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: KELOLA KESAN & PESAN */}
                  {adminTab === 'reviews' && (
                    <div className="space-y-4 text-xs">
                      <div className="flex items-center justify-between">
                        <h4 className="font-serif font-bold text-base text-[#173D2B]">
                          Moderasi Kesan & Pesan Wisatawan ({reviews.length})
                        </h4>
                        <button
                          onClick={() => {
                            if (!confirm('Kembalikan ulasan ke bawaan awal?')) return;
                            setReviews(DEFAULT_REVIEWS);
                            localStorage.removeItem('sukaregang_visitor_reviews');
                            alert('Kesan pesan di-reset.');
                          }}
                          className="text-red-600 hover:underline font-bold"
                        >
                          Reset Kesan Pesan
                        </button>
                      </div>

                      <div className="space-y-3">
                        {reviews.map((r) => (
                          <div key={r.id} className="p-4 bg-white rounded-xl border border-[#E9D8BD] flex items-start justify-between gap-3">
                            <div className="space-y-1">
                              <div className="flex items-center space-x-2">
                                <span className="font-bold text-sm text-[#173D2B]">{r.name}</span>
                                <span className="text-gray-500">({r.city})</span>
                                <span className="text-amber-500 font-bold">{'⭐'.repeat(r.rating)}</span>
                              </div>
                              <span className="text-[10px] text-[#8B4A2B] font-semibold block">{r.destinationVisited} • {r.date}</span>
                              <p className="text-xs text-[#35251D]/80 italic">"{r.comment}"</p>
                            </div>
                            <button
                              onClick={() => {
                                const updated = reviews.filter(rev => rev.id !== r.id);
                                setReviews(updated);
                                localStorage.setItem('sukaregang_visitor_reviews', JSON.stringify(updated));
                              }}
                              className="px-2.5 py-1 text-red-600 bg-red-50 hover:bg-red-100 rounded-lg font-bold flex-shrink-0"
                            >
                              Hapus
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 3: DESTINASI */}
                  {adminTab === 'destinations' && (
                    <div className="space-y-4 text-xs">
                      <h4 className="font-serif font-bold text-base text-[#173D2B]">Titik Lokasi Peta ({destinations.length}):</h4>
                      <div className="space-y-2">
                        {destinations.map((d) => (
                          <div key={d.id} className="p-3 bg-white rounded-xl border border-[#E9D8BD] flex items-center justify-between">
                            <div>
                              <span className="font-bold text-[#173D2B]">{d.name}</span>
                              <p className="text-[10px] text-gray-500">{d.address}</p>
                            </div>
                            <a href={d.googleMapsUrl} target="_blank" className="text-blue-600 hover:underline">
                              Buka Maps ↗
                            </a>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 4: VIDEOS */}
                  {adminTab === 'videos' && (
                    <div className="space-y-4 text-xs">
                      <h4 className="font-serif font-bold text-base text-[#173D2B]">Video Edukasi YouTube ({videos.length}):</h4>
                      <div className="space-y-2">
                        {videos.map((v) => (
                          <div key={v.id} className="p-3 bg-white rounded-xl border border-[#E9D8BD] flex items-center justify-between">
                            <div>
                              <span className="font-bold text-[#173D2B]">{v.title}</span>
                              <p className="text-[10px] text-gray-500">ID: {v.youtubeId}</p>
                            </div>
                            <a href={v.youtubeUrl} target="_blank" className="text-red-600 hover:underline">
                              YouTube ↗
                            </a>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* TAB 5: GUIDES */}
                  {adminTab === 'guides' && (
                    <div className="space-y-4 text-xs">
                      <div className="p-4 bg-white rounded-2xl border border-[#E9D8BD] space-y-3">
                        <label className="font-bold block">No. WhatsApp Guide Rizal:</label>
                        <input
                          type="text"
                          value={editGuideRizalWA}
                          onChange={(e) => setEditGuideRizalWA(e.target.value)}
                          className="w-full p-2 bg-[#F8F4EC] rounded-lg border border-[#E9D8BD]"
                        />
                        <label className="font-bold block">No. WhatsApp Guide Rifa:</label>
                        <input
                          type="text"
                          value={editGuideRifaWA}
                          onChange={(e) => setEditGuideRifaWA(e.target.value)}
                          className="w-full p-2 bg-[#F8F4EC] rounded-lg border border-[#E9D8BD]"
                        />
                        <button
                          onClick={() => alert('Kontak WhatsApp berhasil disimpan!')}
                          className="px-4 py-2 bg-[#173D2B] text-white rounded-lg font-bold"
                        >
                          Simpan Kontak
                        </button>
                      </div>
                    </div>
                  )}

                  {/* TAB 6: BACKUP & RESET */}
                  {adminTab === 'backup' && (
                    <div className="space-y-4 text-xs">
                      <div className="p-5 bg-white rounded-2xl border border-[#E9D8BD] space-y-2">
                        <h4 className="font-bold text-[#173D2B]">Unduh Cadangan Seluruh Data (JSON)</h4>
                        <button
                          onClick={() => {
                            const data = { products, destinations, videos, guides, reviews };
                            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url;
                            a.download = 'sukaregang_discovery_data.json';
                            a.click();
                          }}
                          className="px-4 py-2 bg-[#173D2B] text-white rounded-lg font-bold shadow"
                        >
                          📥 Unduh Backup JSON
                        </button>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

    // --- VIRTUAL TOUR 360 ---
    function VirtualTour360() {
      const [currentSpot, setCurrentSpot] = useState(0);
      const [yaw, setYaw] = useState(0);
      const [pitch, setPitch] = useState(0);
      const [zoom, setZoom] = useState(1);
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      const spots = [
        {
          id: 'spot-gerbang',
          title: 'Gerbang Sentra Sukaregang',
          locationName: 'Pintu Gerbang Utama & Tugu Sukaregang',
          desc: 'Titik masuk ikonik ke kawasan sentra industri dan pertokoan kulit Garut.',
          bgUrl: 'https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=1600&q=85',
        },
        {
          id: 'spot-koridor',
          title: 'Koridor Galeri Kulit',
          locationName: 'Jl. Gagak Lumayung Sukaregang',
          desc: 'Jajaran etalase perajin kulit dengan display jaket dan sepatu khas Sukaregang.',
          bgUrl: 'https://images.unsplash.com/photo-1590874103328-eac38a683ce7?auto=format&fit=crop&w=1600&q=85',
        },
        {
          id: 'spot-workshop',
          title: 'Bengkel Penyamakan Tradisional',
          locationName: 'Workshop Pengolahan & Pengeringan Kulit',
          desc: 'Area penyamakan dan pengolahan lembaran kulit domba dan sapi mentah.',
          bgUrl: 'https://images.unsplash.com/photo-1558769132-cb1aea458c5e?auto=format&fit=crop&w=1600&q=85',
        },
        {
          id: 'spot-syakira',
          title: 'Showroom Syakira Leather',
          locationName: 'Pusat Koleksi Jaket & Sepatu Kulit',
          desc: 'Toko kurasi produk kulit asli Sukaregang dengan standar mutu terjamin.',
          bgUrl: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=1600&q=85',
        },
      ];

      const activeSpot = spots[currentSpot];

      const handleMouseDown = (e) => {
        setIsDragging(true);
        setDragStart({ x: e.clientX, y: e.clientY });
      };

      const handleMouseMove = (e) => {
        if (!isDragging) return;
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        setYaw((prev) => (prev + dx * 0.25) % 360);
        setPitch((prev) => Math.max(-40, Math.min(40, prev - dy * 0.15)));
        setDragStart({ x: e.clientX, y: e.clientY });
      };

      const handleMouseUp = () => setIsDragging(false);

      return (
        <div className="relative w-full rounded-2xl overflow-hidden bg-forest-900 border-2 border-warmbeige/40 shadow-2xl">
          <div
            className="relative h-[480px] md:h-[580px] w-full overflow-hidden cursor-grab active:cursor-grabbing select-none"
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
          >
            <div
              className="absolute inset-0 bg-cover bg-center transition-transform duration-75 will-change-transform"
              style={{
                backgroundImage: `url(${activeSpot.bgUrl})`,
                transform: `scale(${zoom}) translate(${yaw * 1.5}px, ${pitch * 1.2}px)`,
                filter: 'brightness(0.92) contrast(1.05)',
              }}
            />
            <div className="absolute inset-0 bg-gradient-to-t from-forest-900/90 via-transparent to-forest-900/50 pointer-events-none" />

            <div className="absolute top-4 left-4 z-10 flex items-center space-x-2 bg-forest/80 backdrop-blur-md px-3 py-1.5 rounded-full border border-warmbeige/40 text-cream text-xs">
              <span className="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
              <span className="font-semibold tracking-wider">360° LIVE PANORAMA</span>
              <span className="text-warmbeige">| Arah: {Math.round((yaw + 360) % 360)}°</span>
            </div>

            <div className="absolute top-4 right-4 z-10 flex flex-col space-y-2 bg-forest/80 backdrop-blur-md p-1.5 rounded-xl border border-warmbeige/40 text-cream">
              <button
                onClick={() => setZoom((z) => Math.min(2.0, z + 0.2))}
                className="w-8 h-8 flex items-center justify-center hover:bg-leather rounded-lg transition"
              >
                +
              </button>
              <button
                onClick={() => setZoom((z) => Math.max(0.9, z - 0.2))}
                className="w-8 h-8 flex items-center justify-center hover:bg-leather rounded-lg transition"
              >
                -
              </button>
              <button
                onClick={() => { setYaw(0); setPitch(0); setZoom(1); }}
                className="w-8 h-8 flex items-center justify-center hover:bg-leather rounded-lg transition"
              >
                ↺
              </button>
            </div>

            <div className="absolute bottom-4 left-4 right-4 z-10 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-3 pointer-events-none">
              <div className="bg-forest/85 backdrop-blur-md p-3.5 rounded-xl border border-warmbeige/40 text-cream max-w-md pointer-events-auto">
                <div className="text-[10px] uppercase font-bold tracking-widest text-warmbeige">Titik Eksplorasi {currentSpot + 1} / {spots.length}</div>
                <h4 className="font-serif text-lg font-bold text-cream">{activeSpot.title}</h4>
                <p className="text-xs text-cream/80 mt-0.5">{activeSpot.desc}</p>
                <div className="mt-2 flex items-center space-x-1.5 text-[11px] text-warmbeige/90">
                  <Icon name="map-pin" className="w-3.5 h-3.5 text-leather-light" />
                  <span>{activeSpot.locationName}</span>
                </div>
              </div>
            </div>
          </div>

          <div className="bg-forest p-3.5 border-t border-warmbeige/30 flex flex-wrap items-center justify-between gap-2">
            <span className="text-xs text-warmbeige font-medium">Pilih Sudut Pandang Kawasan:</span>
            <div className="flex flex-wrap gap-2">
              {spots.map((spot, idx) => (
                <button
                  key={spot.id}
                  onClick={() => {
                    setCurrentSpot(idx);
                    setYaw(0);
                    setPitch(0);
                  }}
                  className={`text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center space-x-1.5 ${
                    currentSpot === idx
                      ? 'bg-warmbeige text-forest font-bold shadow'
                      : 'bg-forest-900/60 text-cream/80 hover:bg-forest-700 hover:text-cream border border-warmbeige/20'
                  }`}
                >
                  <Icon name="camera" className="w-3.5 h-3.5" />
                  <span>{spot.title}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // --- INTERACTIVE MAP ---
    function SukaregangMap({ locations }) {
      const mapContainerRef = useRef(null);
      const mapInstanceRef = useRef(null);
      const [selectedLoc, setSelectedLoc] = useState(locations[0]);
      const [activeCategory, setActiveCategory] = useState('Semua');

      const categories = ['Semua', 'Sentra Industri', 'Landmark', 'Edukasi', 'Toko Mitra'];

      const filteredLocations = useMemo(() => {
        if (activeCategory === 'Semua') return locations;
        return locations.filter((l) => l.category === activeCategory);
      }, [locations, activeCategory]);

      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (!mapInstanceRef.current) {
          const map = L.map(mapContainerRef.current).setView([-7.2148, 107.9155], 16);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap | Sukaregang Discovery',
          }).addTo(map);
          mapInstanceRef.current = map;
        }

        const map = mapInstanceRef.current;
        map.eachLayer((layer) => {
          if (layer instanceof L.Marker) {
            map.removeLayer(layer);
          }
        });

        filteredLocations.forEach((loc) => {
          const marker = L.marker(loc.coordinates).addTo(map);
          marker.bindPopup(`
            <div style="padding: 4px; min-width: 180px;">
              <span style="font-size: 10px; text-transform: uppercase; color: #D6B889; font-weight: bold;">${loc.category}</span>
              <h4 style="margin: 2px 0 6px 0; font-size: 14px; font-weight: bold; color: #F5F0E7;">${loc.name}</h4>
              <p style="margin: 0; font-size: 11px; color: #C2D7CD;">${loc.address}</p>
            </div>
          `);
          marker.on('click', () => setSelectedLoc(loc));
        });
      }, [filteredLocations]);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
          <div className="lg:col-span-2 rounded-2xl overflow-hidden border-2 border-warmbeige/40 shadow-xl bg-forest-900 relative">
            <div className="absolute top-4 left-4 z-[500] flex flex-wrap gap-1.5 bg-forest/85 backdrop-blur-md p-1.5 rounded-xl border border-warmbeige/40 shadow-lg">
              {categories.map((cat) => (
                <button
                  key={cat}
                  onClick={() => setActiveCategory(cat)}
                  className={`text-xs px-2.5 py-1 rounded-lg transition font-medium ${
                    activeCategory === cat ? 'bg-warmbeige text-forest font-bold' : 'text-cream/80 hover:text-cream hover:bg-forest-700'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>
            <div ref={mapContainerRef} className="h-[460px] md:h-[540px] w-full" />
          </div>

          <div className="bg-white rounded-2xl p-6 border-2 border-warmbeige/30 shadow-lg">
            <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-forest/10 text-forest mb-4">
              {selectedLoc.category}
            </span>
            <img src={selectedLoc.imageUrl} alt={selectedLoc.name} className="w-full h-44 object-cover rounded-xl mb-4 shadow" />
            <h3 className="font-serif text-xl font-bold text-forest mb-2">{selectedLoc.name}</h3>
            <p className="text-xs text-charcoal/70 mb-3">📍 {selectedLoc.address}</p>
            <p className="text-xs text-charcoal/80 leading-relaxed mb-4">{selectedLoc.description}</p>
            <div className="bg-cream p-3.5 rounded-xl border border-warmbeige/40">
              <span className="text-leather font-semibold text-xs block mb-1">✨ Tips Wisatawan:</span>
              <p className="text-xs text-charcoal/80">{selectedLoc.visitorTip}</p>
            </div>
          </div>
        </div>
      );
    }

                    className="w-full py-2.5 px-4 bg-white hover:bg-red-50 text-red-600 text-xs font-bold rounded-xl border border-red-200 transition"
                  >
                    Keluar dari Akun (Log Out)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- MODAL DASHBOARD ADMIN: UPLOAD FOTO PRODUK --- */}
          {isAdminPhotoModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-charcoal/80 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white rounded-3xl max-w-4xl w-full overflow-hidden shadow-2xl border-2 border-warmbeige/40 relative max-h-[92vh] flex flex-col">
                <div className="p-5 bg-forest text-cream flex items-center justify-between border-b border-warmbeige/30">
                  <div className="flex items-center space-x-3">
                    <span className="text-xl">📸</span>
                    <div>
                      <h3 className="font-serif text-lg font-bold">Dashboard Admin: Kelola & Upload Foto Produk</h3>
                      <p className="text-[11px] text-warmbeige">Syakira Leather • Fitur khusus upload foto produk asli</p>
                    </div>
                  </div>
                  <button onClick={() => setIsAdminPhotoModalOpen(false)} className="w-8 h-8 rounded-full bg-forest-700 hover:bg-leather flex items-center justify-center text-cream">✕</button>
                </div>

                <div className="p-6 overflow-y-auto custom-scroll flex-1 space-y-4">
                  <p className="text-xs text-charcoal/80 bg-cream p-3 rounded-xl border border-warmbeige/40">
                    ℹ️ <strong>Ketentuan:</strong> Jika foto Shopee tidak dapat diambil otomatis, unggah foto produk asli langsung dari komputer Anda. Foto akan disimpan secara lokal di browser dan langsung menggantikan tampilan produk di seluruh halaman.
                  </p>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {PRODUCTS_DATA.map((p) => {
                      const currentImg = customImages[p.id] || p.imageUrl;
                      return (
                        <div key={p.id} className="p-3.5 rounded-2xl border border-warmbeige/40 bg-white flex items-center space-x-3 shadow-sm">
                          <img src={currentImg} alt={p.name} className="w-16 h-16 object-cover rounded-xl border border-warmbeige/40 flex-shrink-0" />
                          <div className="flex-1 min-w-0">
                            <span className="text-[10px] text-leather font-bold uppercase">{p.category}</span>
                            <h5 className="font-serif font-bold text-forest text-xs truncate">{p.name}</h5>
                            <div className="mt-2 flex items-center space-x-2">
                              <label className="cursor-pointer px-2 py-1 bg-forest text-cream text-[10px] font-semibold rounded-lg hover:bg-forest-700 transition">
                                Unggah File
                                <input
                                  type="file"
                                  accept="image/*"
                                  className="hidden"
                                  onChange={(e) => {
                                    const file = e.target.files?.[0];
                                    if (file) {
                                      const reader = new FileReader();
                                      reader.onload = (ev) => {
                                        handleUpdateProductImage(p.id, ev.target.result);
                                      };
                                      reader.readAsDataURL(file);
                                    }
                                  }}
                                />
                              </label>
                              {customImages[p.id] && (
                                <button
                                  onClick={() => handleResetProductImage(p.id)}
                                  className="text-[10px] text-red-600 hover:underline"
                                >
                                  Reset Shopee
                                </button>
                              )}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-forest text-cream border-t-2 border-warmbeige/40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
              <div className="grid grid-cols-1 md:grid-cols-12 gap-10">
                <div className="md:col-span-4 space-y-4">
                  <h4 className="font-serif text-xl font-bold tracking-tight text-cream">
                    SUKAREGANG <span className="text-warmbeige font-light italic">DISCOVERY</span>
                  </h4>
                  <p className="text-xs text-cream/70 leading-relaxed">
                    Platform digital interaktif yang memperkenalkan kawasan Sukaregang, Garut, sebagai sentra kerajinan kulit terkemuka di Indonesia.
                  </p>
                </div>
                <div className="md:col-span-4 space-y-2">
                  <h5 className="font-serif text-base font-bold text-warmbeige">Katalog & Store</h5>
                  <button onClick={() => setCurrentRoute('store')} className="text-xs text-cream/80 hover:text-warmbeige block text-left">
                    Syakira Leather Store (20 Produk)
                  </button>
                  <button onClick={() => setCurrentRoute('explore')} className="text-xs text-cream/80 hover:text-warmbeige block text-left">
                    Explore Sukaregang & Virtual Tour
                  </button>
                </div>
                <div className="md:col-span-4 space-y-2">
                  <h5 className="font-serif text-base font-bold text-warmbeige">Official Marketplace</h5>
                  <a href="https://shopee.co.id" target="_blank" rel="noopener noreferrer" className="inline-block px-4 py-2 bg-leather text-white text-xs font-bold rounded-xl">
                    Kunjungi Shopee Syakira Leather ↗
                  </a>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
